<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>Обновление</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
         background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  p { max-width: 320px; font-size: 17px; line-height: 1.5; }
</style>
</head>
<body>
  <!-- Временная страница на время переезда приложения -->
  <p>Приложение обновляется.<br>Через несколько минут оно снова откроется — просто обновите страницу.</p>
</body>
</html>
